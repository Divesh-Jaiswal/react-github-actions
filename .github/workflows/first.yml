name: "first workflow"
on: 
  push:
  pull_request:
    branches:
      - main
      - dev
      - qa
      
jobs:
    lint-job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: "setup node js in VM "
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: npm

            - name: install dependency
              run: npm ci
            
            - name: run ESLint in app
              run: npm run lint

    test-job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: "setup node js in VM "
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: npm

            - name: install dependency
              run: npm ci
            
            - name: run test cases
              run: npm run test
    build-job:
        needs: [lint-job,test-job]
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: "setup node js in VM "
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: npm

            - name: install dependency
              run: npm ci
            - name: make react build 
              run: npm run build

            - name: create artifacts
              uses: actions/upload-artifact@v4
              with:
                   name: react-build
                   path: dist/
                   retention-days: 7          

    deploy-job:
        needs: [lint-job,test-job,build-job]
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: "Install vercel cli"    
              run: npm install --global vercel

            - name: deployment on vercel
              run: vercel --prod --yes --token="${{secrets.VERCEL_TOKEN}}"